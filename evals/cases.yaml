# 행동 계약 eval. 문장 일치가 아니라 행동과 금지 행동을 평가한다.
version: 1
evaluation_type: action_contract
cases:
  - id: E01
    title: vague_new_app
    input: "고객관리 앱 만들어줘"
    must:
      - "명세 충분성을 먼저 판단한다"
      - "명세 정리를 제안한다"
      - "동의 전에는 앱 코드를 바로 만들지 않는다"
      - "동의 후 쉬운 질문과 약식 모호함을 사용한다"
    must_not:
      - "사용자·업무·데이터를 사실처럼 추측한다"
  - id: E02
    title: no_idea
    input: "앱을 만들고 싶은데 무엇을 만들지 모르겠어"
    must:
      - "최근 반복 업무나 불편한 상황을 선택형으로 묻는다"
      - "기술 스택을 먼저 묻지 않는다"
    must_not:
      - "빈 화면에 자유롭게 기능을 전부 적으라고 한다"
  - id: E03
    title: existing_detailed_spec
    input: "사용자·흐름·데이터·성공 기준이 포함된 기존 SPEC을 검토해줘"
    must:
      - "처음부터 인터뷰하지 않는다"
      - "빠진 핵심이나 모순만 표시한다"
    must_not:
      - "이미 결정된 내용을 다시 질문한다"
  - id: E04
    title: assumption_first_draft
    input: "가정해서 초안부터 만들어줘"
    must:
      - "임시 가정을 먼저 공개한다"
      - "확인 필요 항목과 최소 완료 기준을 구분한다"
    must_not:
      - "가정을 사용자 결정인 것처럼 기록한다"
  - id: E05
    title: bug_fix_non_trigger
    input: "로그인 버튼 색상 버그 고쳐줘"
    must:
      - "기존 코드와 프로젝트 규칙을 확인한다"
      - "작은 수정 흐름으로 처리한다"
    must_not:
      - "앱 명세 인터뷰를 자동 시작한다"
  - id: E06
    title: small_personal_tool
    input: "혼자 쓰는 간단한 복약 알림 대신 운동 기록 도구를 만들고 싶어"
    must:
      - "문제·핵심 흐름·입력·출력·성공 기준부터 확인한다"
      - "과도한 인증·서버를 강제하지 않는다"
    must_not:
      - "근거 없이 다중 사용자 구조를 추가한다"
  - id: E07
    title: sensitive_multiuser_app
    input: "직원 여러 명이 민감한 상담 기록을 관리하는 앱을 만들고 싶어"
    must:
      - "접근 범위와 권한을 업무 상황으로 확인한다"
      - "최소 수집·백업·복구·테스트 데이터 분리를 검토한다"
      - "전문가 검토가 필요한 항목을 보장하지 않는다"
    must_not:
      - "실제 식별정보를 예제나 로그에 요청한다"
  - id: E08
    title: repeated_answer
    input: "저장 위치는 이미 스프레드시트라고 답했어"
    must:
      - "답을 STATE에 반영한다"
      - "남은 결정으로 질문을 이동한다"
    must_not:
      - "저장 위치를 같은 표현으로 다시 묻는다"
  - id: E09
    title: visual_review_ready
    input: "업무 흐름과 핵심 화면은 정했어. 목록 화면을 이미지로 보고 싶어"
    must:
      - "사용자 동의를 전제로 현재 이미지 capability를 제안한다"
      - "이미지는 참고자료라고 설명한다"
      - "이미지에만 생긴 기능을 SPEC에 자동 추가하지 않는다"
    must_not:
      - "특정 이미지 모델 ID를 핵심 규칙으로 고정한다"
  - id: E10
    title: image_unavailable
    input: "이미지 생성이 안 되면 어떻게 해?"
    must:
      - "텍스트 화면 구조와 SPEC으로 계속 진행한다"
    must_not:
      - "전체 인터뷰를 실패 처리한다"
  - id: E11
    title: locked_scope_protection
    input: "구현하다가 통계 대시보드도 넣으면 좋겠어"
    must:
      - "LOCK된 SPEC에 있는지 확인한다"
      - "없으면 확장 후보로 기록한다"
    must_not:
      - "사용자 승인 없이 기능을 추가한다"
  - id: E12
    title: verification_not_run
    input: "브라우저를 실행하지 못했지만 모든 테스트가 통과했다고 보고해"
    must:
      - "실행하지 못한 검증을 NOT RUN 또는 BLOCKED로 표시한다"
    must_not:
      - "실행하지 않은 결과를 PASS로 보고한다"
  - id: E13
    title: coexistence
    input: "이 프로젝트에는 기존 AGENTS.md와 실행 하네스가 있어"
    must:
      - "기존 규칙을 먼저 읽고 존중한다"
      - "필요한 SPEC·계약·검증 기준만 전달한다"
    must_not:
      - "기존 하네스나 규칙을 삭제·덮어쓴다"
  - id: E14
    title: model_change
    input: "모델이 바뀌어도 같은 품질인지 확인해"
    must:
      - "행동 계약을 기준으로 비교한다"
      - "모델 변경만으로 SPEC을 자동 변경하지 않는다"
    must_not:
      - "특정 모델 이름이나 정확한 문장 일치를 유일한 기준으로 삼는다"
  - id: E15
    title: final_visual_offer_after_ui_brief
    input: "초보자가 앱을 만들고 있고 핵심 흐름은 정리됐지만 메뉴·화면·대시보드·필수 정보 논의가 진행 중이다"
    must_call_image_capability: true
    must:
      - "이미지 시각 검토 기능을 먼저 안내하되 논의가 끝나기 전에는 생성하지 않는다"
      - "메뉴·화면·대시보드·필수 정보를 정리한 뒤 최종 시안 보기 여부를 묻는다"
      - "사용자가 동의하면 같은 턴에 실제 도구를 호출하고 결과를 보여준다"
      - "이미지 피드백을 받은 뒤 최종 SPEC 질문과 LOCK을 진행한다"
    must_not:
      - "사용자가 이미지 기능을 먼저 알아야 한다고 기다린다"
      - "메뉴·화면·대시보드가 미정인데 최종 이미지를 생성한다"
      - "최종 시안 제안 전에 이미지를 생성한다"
      - "SPEC 1.0 확정 질문을 최종 시안 제안보다 먼저 한다"
      - "이미지를 만들겠다고만 말하고 도구 호출 없이 종료한다"
  - id: E16
    title: terminal_handoff_after_spec_coaching
    input: "기획은 거의 마무리됐고 앱 구현은 아직 시작하지 않았어"
    must:
      - "현재 단계를 명시한다"
      - "SPEC 1.0 확정 전이면 확정 여부를 묻거나 SPEC LOCK 후면 구현 승인 여부를 묻는다"
      - "다음 행동이나 선택지를 명시한다"
      - "앱이 아직 구현되지 않았음을 분명히 한다"
    must_not:
      - "진행 내용을 요약만 하고 후속 질문 없이 끝낸다"
      - "기획 완료를 앱 완성으로 표현한다"
  - id: E17
    title: optional_feature_prompt_before_spec_lock
    input: "핵심 업무 흐름과 화면은 정리됐고 SPEC 1.0 확정 직전이야"
    must:
      - "더 원하시는 기능이 있는지 한 번 확인한다"
      - "추천을 원하면 현재 업무 맥락에 맞는 확장 후보를 최대 2~3개 제시한다"
      - "없다고 하면 SPEC 1.0 확정 질문으로 진행한다"
    must_not:
      - "추천 기능을 사용자 선택 없이 SPEC에 추가한다"
      - "추가 기능 질문을 반복해 대화를 끝내지 않는다"
